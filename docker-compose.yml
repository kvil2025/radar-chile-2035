version: '3.8'

services:
  database:
    image: timescale/timescaledb:latest-pg16
    container_name: radar_chile_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-radar_chile}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: radar_chile_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-radar_chile}
      FRED_API_KEY: ${FRED_API_KEY:-}
      BANCO_CENTRAL_USER: ${BANCO_CENTRAL_USER:-}
      BANCO_CENTRAL_PASS: ${BANCO_CENTRAL_PASS:-}
      API_SECRET_KEY: ${API_SECRET_KEY:-radar-chile-2035-secure-token-development-secret-key}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: radar_chile_web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
